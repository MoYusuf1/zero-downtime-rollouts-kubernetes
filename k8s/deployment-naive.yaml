# The "it runs" version: no readiness probe, no shutdown delay.
# Kubernetes sends traffic to a new pod as soon as its container starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote
  namespace: rollouts
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quote
  template:
    metadata:
      labels:
        app: quote
    spec:
      containers:
        - name: app
          image: quote:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
